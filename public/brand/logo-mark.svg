<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Gulf Breeze HVAC mark">
  <defs>
    <linearGradient id="gbMarkCool" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="55%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#0a2a3a"/>
    </linearGradient>
    <linearGradient id="gbMarkFoam" x1="20" y1="18" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0f7fa"/>

  <path d="M16 35c8-6 16-7 24-3" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
  <path d="M18 42c7-5 14-5 20-2" fill="none" stroke="#14b8a6" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <!-- Cool droplet / HVAC core -->
  <path d="M32 18c0 0 8 10 8 15.5a8 8 0 1 1-16 0C24 28 32 18 32 18z" fill="url(#gbMarkFoam)"/>
  <circle cx="32" cy="35.5" r="2.2" fill="#0a2a3a" opacity="0.55"/>

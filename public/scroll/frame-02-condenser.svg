<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Outdoor AC condenser unit near home wall">
  <defs>
    <linearGradient id="s2sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7490"/><stop offset="100%" stop-color="#e0f7fa"/>
    </linearGradient>
    <linearGradient id="s2wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f1f5f9"/><stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="s2unit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#0a2a3a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#s2sky)"/>
  <!-- wall -->
  <rect x="0" y="120" width="780" height="620" fill="url(#s2wall)"/>
  <path d="M0 120h780" stroke="#cbd5e1" stroke-width="4"/>
  <!-- siding lines -->
  <g stroke="#cbd5e1" stroke-width="2" opacity="0.7">
    <path d="M40 220h700M40 280h700M40 340h700M40 400h700M40 460h700M40 520h700M40 580h700"/>
  </g>
  <!-- window -->
  <rect x="120" y="220" width="200" height="160" rx="6" fill="#bae6fd" stroke="#0e7490" stroke-width="5"/>
  <path d="M220 220v160M120 300h200" stroke="#0e7490" stroke-width="4"/>
  <rect x="120" y="220" width="200" height="40" fill="#fff" opacity="0.2"/>
  <!-- ground pad -->
  <rect y="740" width="1200" height="160" fill="#94a3b8"/>
  <rect y="720" width="1200" height="30" fill="#64748b"/>
  <rect x="520" y="700" width="280" height="40" rx="4" fill="#cbd5e1"/>
  <!-- condenser -->
  <g transform="translate(560,430)">
    <rect x="0" y="0" width="200" height="270" rx="12" fill="url(#s2unit)"/>
    <rect x="16" y="18" width="168" height="160" rx="8" fill="#0a2a3a"/>
    <!-- fan grille -->
    <circle cx="100" cy="98" r="62" fill="none" stroke="#64748b" stroke-width="4"/>
    <circle cx="100" cy="98" r="48" fill="none" stroke="#475569" stroke-width="3"/>
    <circle cx="100" cy="98" r="10" fill="#14b8a6"/>
    <g stroke="#38bdf8" stroke-width="3" opacity="0.7">
      <path d="M100 50v30M100 116v30M52 98h30M118 98h30"/>
      <path d="M68 66l22 22M110 108l22 22M68 130l22-22M110 88l22-22"/>
    </g>
    <rect x="24" y="195" width="152" height="18" rx="3" fill="#334155"/>
    <rect x="24" y="225" width="100" height="12" rx="2" fill="#0e7490"/>
    <rect x="134" y="225" width="42" height="12" rx="2" fill="#14b8a6"/>
    <!-- service panel -->
    <rect x="-8" y="80" width="14" height="70" rx="2" fill="#334155"/>
  </g>
  <!-- refrigerant lines -->
  <path d="M560 520 H420 V380" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <path d="M560 545 H440 V400" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  <!-- cool air -->
  <g fill="none" stroke-linecap="round" opacity="0.75">
    <path d="M800 480c40-10 70-8 100 10" stroke="#67e8f9" stroke-width="4"/>
    <path d="M800 520c45-8 80-6 110 12" stroke="#14b8a6" stroke-width="3.5"/>
    <path d="M800 560c38-6 68-4 95 10" stroke="#e0f7fa" stroke-width="3"/>
  </g>
  <!-- shrub -->
  <ellipse cx="980" cy="720" rx="110" ry="40" fill="#0e7490" opacity="0.55"/>
  <ellipse cx="1040" cy="700" rx="70" ry="50" fill="#14b8a6" opacity="0.45"/>
</svg>

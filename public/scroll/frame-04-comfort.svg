<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Cool comfortable living room at 72 degrees">
  <defs>
    <linearGradient id="s4wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f7fa"/><stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="s4cool" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="s4glow" cx="50%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#s4wall)"/>
  <rect width="1200" height="900" fill="url(#s4glow)"/>
  <!-- floor -->
  <path d="M0 620 H1200 V900 H0 Z" fill="#dbeafe"/>
  <path d="M0 620 H1200" stroke="#93c5fd" stroke-width="3"/>
  <!-- window with soft gulf light -->
  <rect x="360" y="120" width="480" height="300" rx="8" fill="#7dd3fc" stroke="#0e7490" stroke-width="8"/>
  <rect x="380" y="140" width="440" height="260" fill="#bae6fd"/>
  <!-- outdoor hint -->
  <rect x="380" y="280" width="440" height="120" fill="#14b8a6" opacity="0.35"/>
  <ellipse cx="520" cy="300" rx="40" ry="60" fill="#0a2a3a" opacity="0.25"/>
  <ellipse cx="680" cy="310" rx="50" ry="70" fill="#0a2a3a" opacity="0.2"/>
  <!-- curtains -->
  <rect x="360" y="120" width="40" height="300" fill="#e0f7fa" opacity="0.9"/>
  <rect x="800" y="120" width="40" height="300" fill="#e0f7fa" opacity="0.9"/>
  <!-- sofa -->
  <g transform="translate(220,520)">
    <rect x="40" y="40" width="520" height="120" rx="24" fill="#0e7490"/>
    <rect x="60" y="20" width="200" height="70" rx="18" fill="#14b8a6"/>
    <rect x="300" y="20" width="200" height="70" rx="18" fill="#14b8a6"/>
    <rect x="20" y="50" width="40" height="100" rx="12" fill="#0a2a3a"/>
    <rect x="540" y="50" width="40" height="100" rx="12" fill="#0a2a3a"/>
    <rect x="80" y="55" width="70" height="50" rx="10" fill="#e0f7fa"/>
    <rect x="420" y="55" width="70" height="50" rx="10" fill="#e0f7fa"/>
  </g>
  <!-- coffee table -->
  <rect x="480" y="700" width="240" height="24" rx="6" fill="#64748b"/>
  <rect x="500" y="724" width="16" height="40" fill="#475569"/>
  <rect x="684" y="724" width="16" height="40" fill="#475569"/>
  <!-- plant -->
  <g transform="translate(980,560)">
    <rect x="30" y="100" width="40" height="50" rx="6" fill="#0e7490"/>
    <ellipse cx="50" cy="80" rx="36" ry="50" fill="#14b8a6"/>
    <ellipse cx="28" cy="90" rx="22" ry="36" fill="#0d9488"/>
    <ellipse cx="72" cy="90" rx="22" ry="36" fill="#2dd4bf"/>
  </g>
  <!-- vent with cool air -->
  <rect x="140" y="160" width="120" height="28" rx="4" fill="#334155"/>
  <g fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M160 210c10 40 10 80 0 120" stroke="#67e8f9" stroke-width="3"/>
    <path d="M200 210c8 40 8 80 0 120" stroke="#38bdf8" stroke-width="3"/>
    <path d="M240 210c-8 40-8 80 0 120" stroke="#14b8a6" stroke-width="3"/>
  </g>
  <!-- thermostat card (no literal text required; suggest 72 in art direction) -->
  <g transform="translate(980,160)">
    <rect width="120" height="100" rx="16" fill="#0a2a3a"/>
    <rect x="10" y="10" width="100" height="80" rx="10" fill="#0d3d4f"/>
    <circle cx="60" cy="48" r="28" fill="none" stroke="#14b8a6" stroke-width="4"/>
    <text x="60" y="55" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="800" fill="#e0f7fa">72°</text>
  </g>
  <!-- soft floating cool particles -->
  <g fill="#67e8f9" opacity="0.45">
    <circle cx="300" cy="400" r="4"/><circle cx="700" cy="360" r="3"/><circle cx="850" cy="480" r="5"/>
    <circle cx="450" cy="500" r="3"/><circle cx="600" cy="450" r="4"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Home cutaway showing HVAC ducts and airflow">
  <defs>
    <linearGradient id="s3bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d3d4f"/><stop offset="100%" stop-color="#0a2a3a"/>
    </linearGradient>
    <linearGradient id="s3wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="s3air" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.2"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1200" height="900" fill="url(#s3bg)"/>
  <!-- diagram floor -->
  <rect x="80" y="120" width="1040" height="680" rx="24" fill="#0e7490" opacity="0.15" stroke="#14b8a6" stroke-width="2"/>
  <!-- house outline cutaway -->
  <g transform="translate(180,160)">
    <path d="M40 200 L420 40 L800 200 V640 H40 Z" fill="url(#s3wall)" stroke="#0a2a3a" stroke-width="4"/>
    <!-- cut plane -->
    <path d="M420 40 V640" stroke="#f97316" stroke-width="3" stroke-dasharray="10 8" opacity="0.85"/>
    <!-- floors -->
    <path d="M40 360 H800" stroke="#94a3b8" stroke-width="6"/>
    <path d="M40 520 H800" stroke="#94a3b8" stroke-width="6"/>
    <!-- attic AHU -->
    <rect x="360" y="90" width="120" height="70" rx="8" fill="#0a2a3a"/>
    <rect x="372" y="102" width="96" height="30" rx="4" fill="#14b8a6"/>
    <text x="420" y="175" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700" fill="#0e7490">AIR HANDLER</text>
    <!-- ducts -->
    <g fill="none" stroke="#64748b" stroke-width="18" stroke-linecap="round">
      <path d="M420 160 V280"/>
      <path d="M200 280 H640"/>
      <path d="M200 280 V480"/>
      <path d="M420 280 V480"/>
      <path d="M640 280 V480"/>
    </g>
    <g fill="none" stroke="#94a3b8" stroke-width="10" stroke-linecap="round">
      <path d="M420 160 V280"/>
      <path d="M200 280 H640"/>
      <path d="M200 280 V480"/>
      <path d="M420 280 V480"/>
      <path d="M640 280 V480"/>
    </g>
    <!-- vents -->
    <rect x="170" y="470" width="60" height="16" rx="3" fill="#0e7490"/>
    <rect x="390" y="470" width="60" height="16" rx="3" fill="#0e7490"/>
    <rect x="610" y="470" width="60" height="16" rx="3" fill="#0e7490"/>
    <!-- airflow arrows -->
    <g stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M420 200 v50"/>
      <path d="M300 280 h-60"/>
      <path d="M540 280 h60"/>
      <path d="M200 340 v80"/>
      <path d="M420 340 v80"/>
      <path d="M640 340 v80"/>
    </g>
    <!-- cool mist from vents -->
    <g fill="#67e8f9" opacity="0.35">
      <ellipse cx="200" cy="510" rx="50" ry="18"/>
      <ellipse cx="420" cy="510" rx="50" ry="18"/>
      <ellipse cx="640" cy="510" rx="50" ry="18"/>
    </g>
    <!-- outdoor condenser callout -->
    <rect x="700" y="560" width="70" height="60" rx="6" fill="#334155"/>
    <circle cx="735" cy="585" r="18" fill="none" stroke="#14b8a6" stroke-width="3"/>
    <path d="M640 200 H735 V560" fill="none" stroke="#94a3b8" stroke-width="5" stroke-dasharray="6 6"/>
    <text x="735" y="650" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#67e8f9">CONDENSER</text>
  </g>
  <!-- legend chip -->
  <rect x="100" y="780" width="220" height="36" rx="18" fill="#0a2a3a" opacity="0.7"/>
  <circle cx="124" cy="798" r="6" fill="#38bdf8"/>
  <text x="140" y="803" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#e0f7fa">Cool supply airflow</text>
</svg>
